[project]
name = "logit-router"
version = "0.1.0"
description = "Ultra-low latency LLM-based routing via single forward pass logit extraction"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[project.optional-dependencies]
flash = ["flash-attn"]
dev = ["pytest", "ruff", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logit_router"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
